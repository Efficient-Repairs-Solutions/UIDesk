name: Plane status
on:
  create:
  pull_request_target:
    types:
      [opened, reopened, closed, ready_for_review, converted_to_draft, edited]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: plane-status
  queue: max
jobs:
  update:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile Plane status
        env:
          GH_TOKEN: ${{ github.token }}
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
        run: node .github/plane/sync.mjs
